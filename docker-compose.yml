services:
  postgres:
    image: postgres:16-alpine
    container_name: request-portal-postgres
    environment:
      POSTGRES_DB: request_portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d request_portal"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:
